name = "msets_paper"
version = "0.2.0"
defaultTargets = ["MsetsPaper"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
path = "vendor/mathlib"

[[require]]
name = "coefficient-one"
path = "vendor/coefficient-one"

[[require]]
name = "plausible"
path = "vendor/plausible"

[[require]]
name = "LeanSearchClient"
path = "vendor/LeanSearchClient"

[[require]]
name = "importGraph"
path = "vendor/importGraph"

[[require]]
name = "proofwidgets"
path = "vendor/proofwidgets"

[[require]]
name = "aesop"
path = "vendor/aesop"

[[require]]
name = "Qq"
path = "vendor/Qq"

[[require]]
name = "batteries"
path = "vendor/batteries"

[[require]]
name = "Cli"
path = "vendor/Cli"

[[lean_lib]]
name = "MsetsLower"

[[lean_lib]]
name = "MsetsPaper"
